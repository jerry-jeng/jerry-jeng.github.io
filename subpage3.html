<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業供應鏈分析儀</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">🏢 企業上下游關係分析</h1>
        <p class="text-gray-500 text-center mb-8">輸入公司名稱，自動檢索供應鏈關鍵成員</p>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <div class="flex flex-col gap-4">
                <input type="password" id="apiKey" placeholder="輸入您的 Gemini API Key" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="flex gap-2">
                    <input type="text" id="companyName" placeholder="例如：台積電 (TSMC) 或 輝達 (NVIDIA)" class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="analyzeCompany()" id="btn" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">開始分析</button>
                </div>
            </div>
        </div>

        <div id="loading" class="hidden text-center py-10">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div>
            <p class="text-gray-600">正在分析最新市場數據與供應鏈報告...</p>
        </div>

        <div id="resultArea" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-blue-50 p-5 rounded-xl border border-blue-100">
                <h3 class="font-bold text-blue-800 mb-3 text-lg">⬆️ 上游供應商</h3>
                <ul id="upstreamList" class="space-y-2 text-gray-700"></ul>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl text-white flex flex-col justify-center items-center text-center">
                <span class="text-gray-400 text-sm">目標企業</span>
                <h2 id="targetCompany" class="text-2xl font-bold mt-1"></h2>
            </div>
            <div class="bg-green-50 p-5 rounded-xl border border-green-100">
                <h3 class="font-bold text-green-800 mb-3 text-lg">⬇️ 下游客戶/應用</h3>
                <ul id="downstreamList" class="space-y-2 text-gray-700"></ul>
            </div>
        </div>
    </div>

    <script>
        async function analyzeCompany() {
            const key = document.getElementById('apiKey').value;
            const company = document.getElementById('companyName').value;
            const btn = document.getElementById('btn');
            
            if (!key || !company) return alert("請輸入 API Key 與公司名稱");

            // 顯示 Loading
            btn.disabled = true;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');

            const prompt = `你是一個專業的產業分析師。請針對「${company}」這家公司進行供應鏈分析。
            請列出其主要的：
            1. 上游供應商 (提供原料、設備或服務的公司)
            2. 下游客戶 (直接購買產品或主要應用領域)
            
            請嚴格以 JSON 格式回傳，格式如下：
            {
              "target": "公司名稱",
              "upstream": ["供應商A", "供應商B"],
              "downstream": ["客戶X", "客戶Y"]
            }
            只回傳 JSON 物件，不要有額外文字。`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text;
                
                // 清理可能包含的 Markdown 語法
                text = text.replace(/```json|```/g, '');
                const result = JSON.parse(text);

                // 渲染結果
                document.getElementById('targetCompany').innerText = result.target;
                renderList('upstreamList', result.upstream);
                renderList('downstreamList', result.downstream);

                document.getElementById('resultArea').classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert("分析失敗，請檢查 API Key 或稍後再試。");
            } finally {
                btn.disabled = false;
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function renderList(id, items) {
            const list = document.getElementById(id);
            list.innerHTML = items.map(item => `<li class="bg-white p-2 rounded shadow-sm border border-gray-100">· ${item}</li>`).join('');
        }
    </script>
</body>
</html>
